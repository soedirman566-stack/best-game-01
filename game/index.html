<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberfall — a neon arena survivor</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0908; }
  body { display: flex; align-items: center; justify-content: center; }
  #game {
    width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; display: block;
    touch-action: none; cursor: crosshair; background: #0b0908;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Emberfall: move with WASD or the arrow keys, dash with Shift or Space, survive the husk swarm"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
